<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-labelledby="portraitTitle">
  <title id="portraitTitle">Placeholder portrait — replace with your own photo</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf1ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="figGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
  </defs>

  <rect width="400" height="480" fill="url(#bgGrad)"/>

  <!-- shoulders -->
  <path d="M60 480c0-77 62-130 140-130s140 53 140 130H60Z" fill="url(#figGrad)" opacity="0.92"/>
  <!-- head -->
  <circle cx="200" cy="205" r="82" fill="url(#figGrad)" opacity="0.92"/>

  <!-- subtle rings for polish -->
  <circle cx="200" cy="205" r="82" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15"/>

  <!-- monogram -->
  <text x="200" y="420" text-anchor="middle" font-family="Poppins, sans-serif" font-size="22" font-weight="600" fill="#2563eb" opacity="0.55">ADD YOUR PHOTO</text>
</svg>
